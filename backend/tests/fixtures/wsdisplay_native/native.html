<!doctype html><meta charset="utf-8"><title>Synthetic WS native fixture</title><header class="site-header"><a>My Account SYNTHETIC BUSINESS</a></header><section id="product"></section>
<script>
// SYNTHETIC UI fixture only. The driver never reads these JS variables/models.
let choice='',warehouse='',pms='F',quantity=1,actions=[];const out=location.pathname.includes('OUT');
const data=()=>({sku:out?'SYN-OUT':choice?'SYN-'+choice:'PARENT-MTX',stock:out?0:choice==='B'&&warehouse==='1'?1:5,price:out?21:quantity===1?100:90});
function render(){const d=data(),wh=out||!choice?['1','2']:choice==='A'?['2']:[];
 document.getElementById('product').innerHTML=`<h1>SYNTHETIC product</h1>${out?'':`<label for="custcol_matrix_order_detail_option">Order Detail</label><select id="custcol_matrix_order_detail_option"><option value="">- Select -</option><option value="A" ${choice==='A'?'selected':''}>Graphic Package A</option><option value="B" ${choice==='B'?'selected':''}>Graphic Package B</option></select>`}
 <label for="quantity">Quantity</label><input type="number" id="quantity" min="1" value="${quantity}" data-action="changeQuantity">
 <label for="custcol_turn_around_shipping">Graphic Turnaround Time</label><select id="custcol_turn_around_shipping" disabled><option value="">Select</option><option value="4" ${choice?'selected':''}>Standard 4 Business Days Turnaround</option></select>
 <div><label><input type="radio" name="custcol_webstore_locations" value="1" ${wh.includes('1')?'disabled':''} ${warehouse==='1'?'checked':''}>California ${out||!choice?'':d.stock}</label><label><input type="radio" name="custcol_webstore_locations" value="2" ${wh.includes('2')?'disabled':''} ${warehouse==='2'?'checked':''}>Pennsylvania ${out||!choice?'':d.stock}</label></div>
 ${out?'':`<div><span>Use PMS Match</span><select data-id="custcol_pms_match"><option value="F" ${pms==='F'?'selected':''}>No</option><option value="T" ${pms==='T'?'selected':''}>Yes</option></select></div>${pms==='T'?'<label>PMS Number/s<input type="text" id="custcol_pms_number" required value="PRIVATE_TEXT_TRAP"></label>':''}<div>Upload CMYK Artwork<input type="file"></div>`}
 <span itemprop="price">Online Price:$${d.price.toFixed(2)}</span><div>Total Price: $${(d.price*quantity).toFixed(2)}</div>
 <table><tr><th>Quantity</th><th>Price</th></tr><tr><td>1 - 1</td><td>$${(out?21:100).toFixed(2)}</td></tr><tr><td>2 +</td><td>$${(out?21:90).toFixed(2)}</td></tr></table>
 <div id="productinformation">Material Synthetic Item Weight10 lbsShipping DimensionSYNBOX(61x15x9)Qty1WarrantySKU${d.sku}</div>${choice?`<div id="productdownloads"><a href="${choice==='B'?'https://s3-us-west-2.amazonaws.com/display-templates/PSB/SYN-B_Template.tif.zip':'https://display-templates.s3.us-west-2.amazonaws.com/PDF/SYN-A_Template.pdf'}">Template</a><a href="https://example.invalid/private.pdf">Template</a></div>`:''}${out?'<p>Out of Stock. Item stock low, Call for Order</p>':''}<button type="button" onclick="fetch('/api/cart',{method:'POST',body:'PRIVATE_CART_BODY'})">ADD TO CART</button>`;
}
document.addEventListener('change',async e=>{let k=e.target.id||e.target.name||e.target.getAttribute('data-id');if(!k||e.target.type==='file')return;actions.push({k,v:e.target.value,q:quantity,sku:data().sku});if(k==='quantity')quantity=Number(e.target.value);else if(k==='custcol_matrix_order_detail_option'){choice=e.target.value;warehouse='1';}else if(k==='custcol_webstore_locations')warehouse=e.target.value;else if(k==='custcol_pms_match')pms=e.target.value;document.getElementById('product').setAttribute('aria-busy','true');await fetch('/api/items?item='+encodeURIComponent(choice)+'&q='+quantity);render();document.getElementById('product').removeAttribute('aria-busy');});render();
</script>
