<!doctype html><meta charset=utf-8><h1>Synthetic product</h1><style>#collapseOne:not(.show){display:none}label{display:inline-block}</style>
<main><div id=order-form data-printproducttype=47 data-currentstoretype=broker><label for=size>Size</label><select id=size><option value=11>Small</option></select><label for=quantity>Quantity</label><select id=quantity><option value=100>100</option><option value=250>250</option></select><button type=button aria-controls=collapseOne>Process</button><div id=collapseOne><fieldset><input type=radio name="proofType" id="proofType901" value="901" checked><label for="proofType901">Instantly Processed</label><input type=radio name="proofType" id="proofType902" value="902" ><label for="proofType902">Manually Processed</label></fieldset><fieldset><input type=radio name="proofTypeForManual" id="proofTypeForManual711" value="711" checked><label for="proofTypeForManual711">PDF Proof</label><input type=radio name="proofTypeForManual" id="proofTypeForManual712" value="712" ><label for="proofTypeForManual712">No Proof</label></fieldset><fieldset><input type=radio name="fileDeliveryForManual" id="fileDeliveryForManual501" value="501" checked><label for="fileDeliveryForManual501">Mail Files</label><input type=radio name="fileDeliveryForManual" id="fileDeliveryForManual502" value="502" ><label for="fileDeliveryForManual502">Upload Files Now</label></fieldset><fieldset><input type=radio name="designServices" id="designServices607" value="607" checked><label for="designServices607">Design Service</label><input type=radio name="designServices" id="designServices608" value="608" ><label for="designServices608">No Design Services</label></fieldset></div></div></main><div id=radioBtn><a class="turnAround active" data-toggle=turnaround data-title=1>Regular 3–4 Business Days</a></div><div class=totalSection><div class=subTotal>Subtotal (excludes shipping)</div><div class=col-4>$13.00</div></div><script>
const mode="good",root=document.querySelector('#order-form');const selected={size:'11',quantity:'100',productId:'900012',productionTime:'1',proofType:'901',manualProofType:'711',fileDelivery:'501',designServices:'607',shoppingCartItemId:'',priceGroupId:''};const c={printProductType:'47',fields:{'47':{specs:['size'],options:[]}},jsonObj:{userSelectedOptions:selected,appliedPrices:{productPrice:'13.00'},others:{isAdmin:false,waiveFees:false,itemId:'null',editOrderItem:{},blankProducts:[]}}};root._vnode={component:{proxy:{$refs:{childComponents:{_:{subTree:{component:{refs:{orderFormInstance:c}}}}}}}}};Object.defineProperty(c,'totalPrice',{get(){return mode==='stale_controller'?'13.00':c.jsonObj.appliedPrices.productPrice}});window.controller=c;window.actions=[];root.querySelector('button').onclick=()=>{actions.push('process');document.querySelector('#collapseOne').classList.add('show')};const aliases={proofType:'proofType',proofTypeForManual:'manualProofType',fileDeliveryForManual:'fileDelivery',designServices:'designServices'};
async function nativeQuote(){if(mode==='quiet_only')return;await Promise.all([fetch('/service/rest/v1/products/'+selected.productId+'/prices').then(r=>r.json()),fetch('/service/rest/v1/rules/turnarounds',{method:'POST',body:JSON.stringify({quantity:selected.quantity,specifications:{printProduct:{productType:47,size:11,turnarounds:[1]},other:{}},productOptions:[Number(selected.manualProofType)],itemType:Number(selected.fileDelivery)})}).then(r=>r.json())]);if(mode!=='stale_applied')c.jsonObj.appliedPrices.productPrice=selected.quantity==='100'?'13.00':'28.00';if(mode!=='stale_display'&&mode!=='stale_applied')document.querySelector('.col-4').textContent=selected.quantity==='100'?'$13.00':'$28.00';document.querySelector('.turnAround').textContent=mode==='stale_production'?'Regular 27–31 Business Days':'Regular 3–4 Business Days'}
for(const e of root.querySelectorAll('input[type=radio]'))e.onchange=()=>{selected[aliases[e.name]]=e.value;actions.push(e.name+':'+e.value);nativeQuote()};for(const e of root.querySelectorAll('select'))e.onchange=()=>{selected[e.id]=e.value;actions.push(e.id+':'+e.value);nativeQuote()};</script>
